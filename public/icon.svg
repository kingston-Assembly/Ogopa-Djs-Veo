<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="deckGlowCyan" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="deckGlowPink" cx="70%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff007f" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="#090a0f" />
  <rect x="8" y="8" width="496" height="496" rx="96" fill="none" stroke="#1f2333" stroke-width="3" />

  <!-- Ambient Glow -->
  <circle cx="160" cy="230" r="140" fill="url(#deckGlowCyan)" />
  <circle cx="352" cy="230" r="140" fill="url(#deckGlowPink)" />

  <!-- Deck A Platter (Cyan) -->
  <g transform="translate(160, 230)">
    <circle r="110" fill="#131622" stroke="#00f2fe" stroke-width="4" stroke-dasharray="12 4" />
    <!-- Vinyl Grooves -->
    <circle r="92" fill="none" stroke="#23283c" stroke-width="1.5" />
    <circle r="76" fill="none" stroke="#23283c" stroke-width="1.5" />
    <circle r="60" fill="none" stroke="#23283c" stroke-width="1.5" />
    <!-- Center Label -->
    <circle r="42" fill="url(#cyanGrad)" />
    <circle r="14" fill="#090a0f" />
    <!-- Platter marker -->
    <line x1="0" y1="-106" x2="0" y2="-80" stroke="#00f2fe" stroke-width="5" stroke-linecap="round" />
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="14" fill="#090a0f" text-anchor="middle">A</text>
  </g>

  <!-- Deck B Platter (Pink) -->
  <g transform="translate(352, 230)">
    <circle r="110" fill="#131622" stroke="#ff0844" stroke-width="4" stroke-dasharray="12 4" />
    <!-- Vinyl Grooves -->
    <circle r="92" fill="none" stroke="#23283c" stroke-width="1.5" />
    <circle r="76" fill="none" stroke="#23283c" stroke-width="1.5" />
    <circle r="60" fill="none" stroke="#23283c" stroke-width="1.5" />
    <!-- Center Label -->
    <circle r="42" fill="url(#pinkGrad)" />
    <circle r="14" fill="#090a0f" />
    <!-- Platter marker -->
    <line x1="0" y1="-106" x2="0" y2="-80" stroke="#ff0844" stroke-width="5" stroke-linecap="round" />
    <text x="0" y="5" font-family="sans-serif" font-weight="900" font-size="14" fill="#090a0f" text-anchor="middle">B</text>
  </g>

  <!-- Central Mixer Visual -->
  <g transform="translate(256, 230)">
    <!-- VU Level Lines -->
    <line x1="-12" y1="-70" x2="-12" y2="70" stroke="#1f2438" stroke-width="4" />
    <line x1="12" y1="-70" x2="12" y2="70" stroke="#1f2438" stroke-width="4" />
    <!-- Active level -->
    <line x1="-12" y1="10" x2="-12" y2="65" stroke="#00f2fe" stroke-width="4" />
    <line x1="12" y1="-5" x2="12" y2="65" stroke="#ff0844" stroke-width="4" />
  </g>

  <!-- Crossfader Bottom Strip -->
  <rect x="146" y="380" width="220" height="12" rx="6" fill="#171b29" stroke="#2b324d" stroke-width="2" />
  <!-- Crossfader Knob -->
  <rect x="236" y="368" width="40" height="36" rx="6" fill="#e2e8f0" />
  <line x1="256" y1="373" x2="256" y2="399" stroke="#0f172a" stroke-width="3" stroke-linecap="round" />

  <!-- Brand Typography -->
  <text x="256" y="74" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">OGOPA DJ'S</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="3">OFFLINE VIRTUAL MIXER</text>
</svg>
